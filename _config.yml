title: Rogue Intelligence
tagline: Independent research · since 2025-04-05
description: Independent research laboratory — Valhalla, Yaksha Cipher, and Wave. Self-funded R&D since 2025-04-05.
url: "https://rogue-intelligence-inc.github.io"
baseurl: ""
email: licensing@rogue-intelligence.com
footer_blurb: Self-funded independent R&D · Primary line: Valhalla
lang: en

# Build: GitHub Actions → actions/jekyll-build-pages → deploy-pages
# Extensibility: _data/navigation.yml · _includes/* · collections below
theme: null
markdown: kramdown
highlighter: rouge
strict_front_matter: true

# Future content types (enable output when ready):
collections:
  papers:
    output: false
    permalink: /papers/:name/
  notes:
    output: false
    permalink: /notes/:name/

plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOY.md
  - vendor
  - .github
  - scripts
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
