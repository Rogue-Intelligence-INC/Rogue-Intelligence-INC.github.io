<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
<title>Valhalla runtime stack</title>
<desc>Session, Fate cycle, body, and readout.</desc>
<rect width="860" height="380" fill="#ffffff"/>
<rect x="24" y="44" width="620" height="64" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="40" y="70" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Session</text>
<text x="40" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Text, speech, image, one snapshot</text>
<rect x="24" y="124" width="620" height="64" fill="#0066FF" stroke="#0066FF" stroke-width="1.6"/>
<text x="40" y="150" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Fate</text>
<text x="40" y="170" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#d9fff0">BlackHole, MeshBrain, MultiNova, BaseForce</text>
<rect x="24" y="204" width="620" height="64" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
<text x="40" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Body</text>
<text x="40" y="250" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Hub routes. Tile completes. Stem clusters.</text>
<rect x="24" y="284" width="620" height="64" fill="#ffffff" stroke="#00A99A" stroke-width="1.6"/>
<text x="40" y="310" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Read</text>
<text x="40" y="330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Native answer, or a model head attached later</text>
<line x1="334" y1="108" x2="334" y2="124" stroke="#111" marker-end="url(#a)"/>
<line x1="334" y1="188" x2="334" y2="204" stroke="#111" marker-end="url(#a)"/>
<line x1="334" y1="268" x2="334" y2="284" stroke="#111" marker-end="url(#a)"/>
<rect x="660" y="44" width="176" height="288" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="676" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Internal suite</text>
<text x="676" y="100" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0066FF">U1</text>
<text x="676" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Shared session</text>
<text x="676" y="152" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0066FF">U2</text>
<text x="676" y="170" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Emit or abstain</text>
<text x="676" y="204" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0066FF">U3</text>
<text x="676" y="222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Rescue</text>
<text x="676" y="256" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0066FF">U4</text>
<text x="676" y="274" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Backbone</text>
</svg>
