<text x="479" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#00A99A">104 x 4</text>
<text x="479" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">hub</text>
<rect x="579" y="68" width="170" height="88" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="664" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0066FF">9.27</text>
<text x="664" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">stem sigma</text>
