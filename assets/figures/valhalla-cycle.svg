<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d">
  <title id="t">Valhalla quad cycle</title>
  <desc id="d">BlackHole, then MeshBrain, then MultiNova, then BaseForce, then back.</desc>
  <rect width="760" height="220" fill="#f4faf8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#0e2c33">Scheduling cycle</text>
  <text x="24" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#3d5c63">quad_cycle · fixed order</text>
  <g font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0e2c33">
    <rect x="24" y="78" width="150" height="52" fill="#ffffff" stroke="#145a78" stroke-width="1.6"/>
    <text x="99" y="109" text-anchor="middle">BlackHole</text>
    <rect x="210" y="78" width="150" height="52" fill="#ffffff" stroke="#0d7a68" stroke-width="1.6"/>
    <text x="285" y="109" text-anchor="middle">MeshBrain</text>
    <rect x="396" y="78" width="150" height="52" fill="#ffffff" stroke="#1a6a7a" stroke-width="1.6"/>
    <text x="471" y="109" text-anchor="middle">MultiNova</text>
    <rect x="582" y="78" width="154" height="52" fill="#ffffff" stroke="#0e6b56" stroke-width="1.6"/>
    <text x="659" y="109" text-anchor="middle">BaseForce</text>
  </g>
  <g fill="none" stroke="#0c6e66" stroke-width="1.6" marker-end="url(#a)">
    <line x1="174" y1="104" x2="210" y2="104"/>
    <line x1="360" y1="104" x2="396" y2="104"/>
    <line x1="546" y1="104" x2="582" y2="104"/>
  </g>
  <path d="M659 130 V168 H99 V130" fill="none" stroke="#145a78" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="380" y="186" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#145a78">return to BlackHole</text>
  <text x="24" y="208" font-family="Inter, sans-serif" font-size="12" fill="#3d5c63">Role names in a routing law. Not a model of a nervous system. Wave-C reuses the names for tile-memory pools.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0c6e66"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#145a78"/></marker>
  </defs>
</svg>
