<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d">
  <title id="t">S-WIND calculation cycle</title>
  <desc id="d">Known check, pattern class, degrees of freedom, one outward failure, then a label.</desc>
  <rect width="760" height="460" fill="#f4faf8"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#0e2c33">Calculation cycle</text>
  <text x="24" y="54" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#3d5c63">Engineering report, 24 January 2026 · manuscript steps</text>
  <g font-family="Inter, sans-serif" font-size="13" fill="#0e2c33">
    <rect x="250" y="74" width="260" height="44" fill="#145a78"/>
    <text x="380" y="101" text-anchor="middle" fill="#f4faf8" font-weight="600">Signal in</text>
    <rect x="250" y="142" width="260" height="52" fill="#ffffff" stroke="#145a78" stroke-width="1.5"/>
    <text x="380" y="164" text-anchor="middle" font-weight="600">Knowledge base</text>
    <text x="380" y="182" text-anchor="middle" font-size="12" fill="#3d5c63">Match ’ Known. Not a discovery.</text>
