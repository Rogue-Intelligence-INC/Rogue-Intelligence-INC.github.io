    <text x="380" y="240" text-anchor="middle" font-weight="600">Pattern class</text>
    <text x="380" y="258" text-anchor="middle" font-size="12" fill="#3d5c63">Difference, ratio, product, factorial, recurrence</text>
    <rect x="250" y="294" width="260" height="44" fill="#ffffff" stroke="#1a6a7a" stroke-width="1.5"/>
    <text x="380" y="321" text-anchor="middle" font-weight="600">DoF = n  (d + 1)</text>
    <rect x="250" y="362" width="260" height="44" fill="#0d7a68"/>
    <text x="380" y="389" text-anchor="middle" fill="#f4faf8" font-weight="600">Predict the next point</text>
  </g>
  <g fill="none" stroke="#0c6e66" stroke-width="1.5" marker-end="url(#a)">
    <line x1="380" y1="118" x2="380" y2="142"/>
    <line x1="380" y1="194" x2="380" y2="218"/>
    <line x1="380" y1="270" x2="380" y2="294"/>
    <line x1="380" y1="338" x2="380" y2="362"/>
  </g>
  <rect x="24" y="150" width="190" height="64" fill="#e7f4f1" stroke="#0d7a68"/>
  <text x="119" y="176" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0e2c33">Short signal</text>
  <text x="119" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#3d5c63">Self-loop lengthens it</text>
  <path d="M250 244 H214 V182" fill="none" stroke="#0d7a68" stroke-width="1.4" marker-end="url(#b)"/>
  <rect x="546" y="362" width="190" height="64" fill="#ffffff" stroke="#145a78"/>
  <text x="641" y="388" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0e2c33">One failure</text>
  <text x="641" y="408" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#3d5c63">Descriptive model</text>
  <path d="M510 384 H546" fill="none" stroke="#145a78" stroke-width="1.4" marker-end="url(#c)"/>
  <text x="24" y="444" font-family="Inter, sans-serif" font-size="12" fill="#3d5c63">DoF 0 stays InterpolantFit. Out-of-sample pass and DoF at least 2 can be labeled EmergentLaw. Eight points and degree 7 give DoF 0.</text>
