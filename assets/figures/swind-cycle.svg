<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<title>S-WIND calculation cycle</title>
<desc>Known check, pattern class, degrees of freedom, one outward test.</desc>
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker></defs>
<text x="24" y="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Calculation cycle</text>
<text x="24" y="48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Engineering report, 24 January 2026</text>
<rect x="160" y="70" width="440" height="46" fill="#0066FF" stroke="#0066FF" stroke-width="1.6"/>
<text x="380" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1  Signal in</text>
<line x1="380" y1="116" x2="380" y2="128" stroke="#111" marker-end="url(#a)"/>
<rect x="160" y="128" width="440" height="46" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="380" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">2  Knowledge base. A match is Known.</text>
<line x1="380" y1="174" x2="380" y2="186" stroke="#111" marker-end="url(#a)"/>
<rect x="160" y="186" width="440" height="46" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
<text x="380" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">3  Pattern class: difference, ratio, product, factorial</text>
<line x1="380" y1="232" x2="380" y2="244" stroke="#111" marker-end="url(#a)"/>
<rect x="160" y="244" width="440" height="46" fill="#ffffff" stroke="#00A99A" stroke-width="1.6"/>
<text x="380" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">4  DoF = n - (d + 1)</text>
<line x1="380" y1="290" x2="380" y2="302" stroke="#111" marker-end="url(#a)"/>
<rect x="160" y="302" width="440" height="46" fill="#00C853" stroke="#00C853" stroke-width="1.6"/>
<text x="380" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5  Predict the next point. One failure stops.</text>
<rect x="16" y="186" width="130" height="70" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
<text x="81" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111111">Short signal</text>
<text x="81" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">lengthen it</text>
<path d="M160 209 H146" fill="none" stroke="#00C853" marker-end="url(#a)"/>
<rect x="614" y="302" width="130" height="70" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="679" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111111">One failure</text>
<text x="679" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">descriptive</text>
<line x1="600" y1="325" x2="614" y2="325" stroke="#111" marker-end="url(#a)"/>
</svg>
