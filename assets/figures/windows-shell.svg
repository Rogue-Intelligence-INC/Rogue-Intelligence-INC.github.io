<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t d">
  <title id="t">Windows shell modules</title>
  <desc id="d">An attached instruction model, then conversations, knowledge import, screen reading, and control that stays off.</desc>
  <rect width="760" height="240" fill="#f4faf8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#0e2c33">Shell modules</text>
  <text x="24" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#3d5c63">Usable Windows sub-project · not the cultivation runtime</text>
  <rect x="24" y="78" width="160" height="100" fill="#145a78"/>
  <text x="104" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f4faf8">Attached model</text>
  <text x="104" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#d7efe8">Already trained</text>
  <line x1="184" y1="128" x2="214" y2="128" stroke="#0c6e66" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-family="Inter, sans-serif" font-size="13" fill="#0e2c33">
    <rect x="216" y="78" width="120" height="100" fill="#ffffff" stroke="#145a78"/>
    <text x="276" y="122" text-anchor="middle" font-weight="600">Chats</text>
    <text x="276" y="142" text-anchor="middle" font-size="11" fill="#3d5c63">List of threads</text>
    <rect x="348" y="78" width="120" height="100" fill="#ffffff" stroke="#0d7a68"/>
    <text x="408" y="122" text-anchor="middle" font-weight="600">Knowledge</text>
    <text x="408" y="142" text-anchor="middle" font-size="11" fill="#3d5c63">Import, pending</text>
    <rect x="480" y="78" width="120" height="100" fill="#ffffff" stroke="#1a6a7a"/>
    <text x="540" y="122" text-anchor="middle" font-weight="600">Screen</text>
    <text x="540" y="142" text-anchor="middle" font-size="11" fill="#3d5c63">OCR and controls</text>
    <rect x="612" y="78" width="124" height="100" fill="#ffffff" stroke="#0e2c33" stroke-dasharray="5 3"/>
    <text x="674" y="122" text-anchor="middle" font-weight="600">Control</text>
    <text x="674" y="142" text-anchor="middle" font-size="11" fill="#3d5c63">Off until armed</text>
  </g>
  <text x="24" y="214" font-family="Inter, sans-serif" font-size="12" fill="#3d5c63">Schematic of the shell. Cultivation from an empty session stays on the Valhalla page.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0c6e66"/></marker>
  </defs>
</svg>
