<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180">
<title>Windows shell modules</title>
<desc>Chats, knowledge, screen reading, and gated control.</desc>
<rect width="760" height="180" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker></defs>
<text x="24" y="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Shell modules</text>
<text x="24" y="48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">An attached model. Control stays off.</text>
<rect x="24" y="72" width="130" height="80" fill="#0066FF" stroke="#0066FF" stroke-width="1.6"/>
<text x="89" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Model</text>
<text x="89" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#d9fff0">already trained</text>
<line x1="154" y1="112" x2="176" y2="112" stroke="#111" marker-end="url(#a)"/>
<rect x="180" y="72" width="132" height="80" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="246" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Chats</text>
<text x="246" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">thread list</text>
<rect x="325" y="72" width="132" height="80" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
<text x="391" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Knowledge</text>
<text x="391" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">import, pending</text>
<rect x="470" y="72" width="132" height="80" fill="#ffffff" stroke="#00A99A" stroke-width="1.6"/>
<text x="536" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Screen</text>
<text x="536" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">OCR, controls</text>
<rect x="615" y="72" width="132" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="681" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Control</text>
<text x="681" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">off until on</text>
</svg>
