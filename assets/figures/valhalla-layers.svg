<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190">
<title>Valhalla cultivation layers</title>
<desc>L1, L2, and optional L3.</desc>
<rect width="760" height="190" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker></defs>
<text x="24" y="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">From an empty session</text>
<text x="24" y="48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Three structure layers. No language-model gradient at the start.</text>
<rect x="24" y="68" width="220" height="100" fill="#ffffff" stroke="#0066FF" stroke-width="1.6"/>
<text x="40" y="96" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0066FF">L1</text>
<text x="40" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Zero-weight</text>
<text x="40" y="144" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Affinity on an empty session</text>
<line x1="244" y1="118" x2="270" y2="118" stroke="#111" marker-end="url(#a)"/>
<rect x="270" y="68" width="220" height="100" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
<text x="286" y="96" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#00C853">L2</text>
<text x="286" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Fate pretraining</text>
<text x="286" y="144" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Affinity epochs, hub spread</text>
<line x1="490" y1="118" x2="516" y2="118" stroke="#111" marker-end="url(#a)"/>
<rect x="516" y="68" width="220" height="100" fill="#ffffff" stroke="#00A99A" stroke-width="1.6"/>
<text x="532" y="96" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#00A99A">L3</text>
<text x="532" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111">Optional bake</text>
<text x="532" y="144" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Weight delta about 298</text>
</svg>
