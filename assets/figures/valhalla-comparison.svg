<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
<title>Valhalla comparisons</title>
<desc>Shared against isolated, and structure against the model head.</desc>
<rect width="760" height="320" fill="#ffffff"/>
<text x="24" y="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Two internal comparisons</text>
<text x="24" y="48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Fast scorecard, 14 July 2026</text>
<text x="24" y="78" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">U1 shared session. Axis starts at 0.90.</text>
<line x1="48" y1="96" x2="48" y2="236" stroke="#111"/>
<line x1="48" y1="236" x2="340" y2="236" stroke="#111"/>
<text x="42" y="100" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">1.00</text>
<text x="42" y="240" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">0.90</text>
<rect x="90" y="98" width="70" height="138" fill="#0066FF"/>
<text x="125" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">0.9999</text>
<text x="125" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">Shared</text>
<rect x="210" y="140" width="70" height="96" fill="#00C853"/>
<text x="245" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">0.968</text>
<text x="245" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">Isolated</text>
<text x="400" y="78" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">Multiple choice, 46 items. Axis 0 to 100.</text>
<line x1="400" y1="96" x2="400" y2="236" stroke="#111"/>
<line x1="400" y1="236" x2="740" y2="236" stroke="#111"/>
<text x="394" y="100" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">100</text>
<text x="394" y="240" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">0</text>
<rect x="470" y="187" width="70" height="49" fill="#00A99A"/>
<text x="505" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">35%</text>
<text x="505" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">Structure</text>
<rect x="590" y="148" width="70" height="88" fill="#0066FF"/>
<text x="625" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">63%</text>
<text x="625" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111">Model head</text>
<text x="24" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">Internal records. Open answers use a different path.</text>
</svg>
